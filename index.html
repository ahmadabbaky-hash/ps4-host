<!DOCTYPE html>

    * {

      display: flex;
      flex-direction: column;

      position: relative;
    }

    /* لوجو النادي الأهلي في اليمين */
    .ahly-logo-container {
      position: absolute;
      top: 20px;
      right: 25px;
      z-index: 100;
    }

    .ahly-logo-container img {
      width: 65px;
      height: auto;
      filter: drop-shadow(0px 4px 8px rgba(229, 9, 20, 0.4));
      opacity: 0.9;
    }

    .main-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 550px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 5px;
      color: #ffffff;
    }

    .sub-title {
      font-size: 15px;
      color: #e50914;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .phone-btn {
      display: inline-block;
      background: #e50914;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .status-text {
      font-size: 14px;
      color: #ffd700;
      margin: 10px 0 20px 0;
      padding: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 8px;
    }

    /* شبكة أزرار الثغرات */
    .payloads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-payload {
      background: rgba(229, 9, 20, 0.2);
      border: 1px solid #e50914;
      color: #ffffff;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-payload:hover, .btn-payload:active {
      background: #e50914;
      box-shadow: 0 0 12px rgba(229, 9, 20, 0.6);
      transform: translateY(-2px);
    }

    .btn-goldhen {
      background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      border: 1px solid #ffd700;
      color: #000;
      grid-column: span 2;
      font-size: 16px;
    }

    .btn-goldhen:hover, .btn-goldhen:active {
      background: linear-gradient(135deg, #ffd700 0%, #d4af37 100%);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }

    .footer-section {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 15px;
    }

    .footer-title {
      font-size: 18px;
      font-weight: bold;
      color: #fff;
    }

    .footer-sub {
      font-size: 13px;
      color: #888;
      letter-spacing: 1px;
      margin-top: 3px;
    }
  </style>
</head>

<body>

  <script>

      if (typeof main === 'function') {
        main(payloadFile);
      } else if (typeof runPayload === 'function') {
        runPayload(payloadFile);
      }
    }

</body>

</html>
